const TAG_META = {
  api:    { label: 'API',     cls: 'tag-api' },
  db:     { label: 'DB',      cls: 'tag-db' },
  fe:     { label: 'Frontend', cls: 'tag-fe' },
  auth:   { label: 'Auth',    cls: 'tag-auth' },
  test:   { label: 'Test',    cls: 'tag-test' },
  deploy: { label: 'Deploy',  cls: 'tag-deploy' },
  email:  { label: 'Email',   cls: 'tag-email' },
};

let state = {
  week: 1,
  member: 'all',
  checked: JSON.parse(localStorage.getItem('scente_trello') || '{}')
};

function save() {
  localStorage.setItem('scente_trello', JSON.stringify(state.checked));
}

function getMember(id) {
  return MEMBERS.find(m => m.id === id);
}

function buildWeekTabs() {
  const container = document.getElementById('weekTabs');
  container.innerHTML = WEEKS.map(w =>
    `<button class="week-tab ${w.id === state.week ? 'active' : ''}" onclick="setWeek(${w.id})">${w.title}</button>`
  ).join('');
}

function buildFilters() {
  const row = document.getElementById('filterRow');
  const allBtn = `<button class="member-pill ${state.member === 'all' ? 'active' : ''}" onclick="setMember('all')">All</button>`;
  const memberBtns = MEMBERS.map(m =>
    `<button class="member-pill ${state.member === m.id ? 'active' : ''}" onclick="setMember('${m.id}')" style="${state.member === m.id ? `background:${m.bg};border-color:${m.color};color:${m.color}` : ''}">${m.name}</button>`
  ).join('');
  row.innerHTML = `<span class="filter-label">Member:</span>${allBtn}${memberBtns}`;
}

function buildMeta() {
  const week = WEEKS.find(w => w.id === state.week);
  const allTasks = week.columns.flatMap(c => c.tasks);
  const visible = state.member === 'all' ? allTasks : allTasks.filter(t => t.member === state.member);
  const done = visible.filter(t => state.checked[t.id]).length;
  const pct = visible.length ? Math.round((done / visible.length) * 100) : 0;

  document.getElementById('weekMeta').innerHTML = `
    <div class="week-heading">${week.title} — ${week.subtitle}</div>
    <div class="week-desc">${week.desc}</div>
    <div class="week-summary">
      <div class="week-stat"><div class="week-stat-val">${visible.length}</div><div class="week-stat-lbl">Total tasks</div></div>
      <div class="week-stat"><div class="week-stat-val" style="color:#4a8c6a">${done}</div><div class="week-stat-lbl">Completed</div></div>
      <div class="week-stat"><div class="week-stat-val" style="color:#d4808a">${visible.length - done}</div><div class="week-stat-lbl">Remaining</div></div>
      <div class="week-stat">
        <div class="week-stat-val">${pct}%</div>
        <div class="week-stat-lbl">Progress</div>
        <div class="progress-bar-wrap" style="margin-top:6px"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      </div>
    </div>
  `;
}

function buildBoard() {
  const week = WEEKS.find(w => w.id === state.week);
  const board = document.getElementById('board');

  board.innerHTML = week.columns.map(col => {
    const tasks = state.member === 'all'
      ? col.tasks
      : col.tasks.filter(t => t.member === state.member);

    if (tasks.length === 0) return '';

    const doneCount = tasks.filter(t => state.checked[t.id]).length;
    const pct = tasks.length ? Math.round((doneCount / tasks.length) * 100) : 0;

    const taskHTML = tasks.map(task => {
      const checked = !!state.checked[task.id];
      const member = getMember(task.member);
      const tags = task.tags.map(tag => {
        const t = TAG_META[tag];
        return t ? `<span class="tag ${t.cls}">${t.label}</span>` : '';
      }).join('');

      return `
        <div class="task-card ${checked ? 'done' : ''}" id="card-${task.id}">
          <div class="task-top">
            <span class="task-title">${task.title}</span>
            <button class="check-btn ${checked ? 'checked' : ''}" onclick="toggleTask('${task.id}')" title="Mark complete"></button>
          </div>
          <div class="task-meta">
            ${tags}
            <div class="member-badge" style="background:${member.bg};color:${member.color}" title="${member.name}">${member.name.slice(0,2).toUpperCase()}</div>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="column">
        <div class="col-header">
          <span class="col-title">${col.title}</span>
          <span class="col-count">${doneCount}/${tasks.length}</span>
        </div>
        ${taskHTML || '<div class="empty-col">No tasks</div>'}
        <div class="col-progress"><div class="col-progress-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('');
}

function render() {
  buildWeekTabs();
  buildFilters();
  buildMeta();
  buildBoard();
}

function setWeek(w) {
  state.week = w;
  render();
}

function setMember(m) {
  state.member = m;
  render();
}

function toggleTask(id) {
  state.checked[id] = !state.checked[id];
  save();
  render();
}

render();
</script>
